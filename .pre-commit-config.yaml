repos:
  - repo: local
    hooks:
      - id: dart-format
        name: Dart Format
        entry: dart format .
        language: system
        pass_filenames: false

      - id: dart-format-check
        name: Dart Format Check
        entry: dart format --output=none --set-exit-if-changed .
        language: system
        pass_filenames: false

      - id: dart-analyze
        name: Dart Analyze
        entry: dart analyze
        language: system
        pass_filenames: false

      - id: dart-test
        name: Dart Test
        entry: dart test
        language: system
        pass_filenames: false
